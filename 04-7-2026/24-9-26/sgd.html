<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<style>

    /* body */
    body{

        background-color: #2973ce;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }


    #profile-card{

        width: 600px;
        background-color: rgb(54, 157, 147);
        border: 1px solid #eeeeee;
        border-radius: 30px;
        margin: auto;
    }


    .pro-image{
        width: 200px;
        height: 200px;
        border: 10px solid #dcecff;
        border-radius: 50%;
        
        margin: auto;
    }

    h1{
        color: #071936;
        font-size: 45px;
    }

    h2{

        color: #5b6b82;
        font-size: 28px;
        font-weight: normal;
    }

    h1, h2, .desc{
        font-family: Arial, sans-serif;
    }

    /* desc */



    .fa-location-dot, .fa-envelope, .fa-circle-user{
        color: red;
        text-align: auto;
    }

</style>
<body>


    <div id="profile-card">

        <div class="pro-image">

        </div>


        <h1>Vivek Ravat</h1>
        <h2>web Developer</h2>


        <p class="desc">
            Passionate about creating beautiful and
            <br>
            functional web experiences.
        </p>

        <div class="contact">

            <!-- icons web -> font awesome  -->
            <p>
                <span><i class="fa-solid fa-location-dot"></i></span>
                Vadodara, India
            </p>
            
            <p>
                <span><i class="fa-regular fa-envelope"></i></span>
                 ravatvivekk@gmail.com   
            </p>

            <p>
                <span><i class="fa-solid fa-circle-user"></i></span>
                +91 7710194756
            </p>
        </div>

        <div class="skills">

            <span class="html">HTML |</span>
            <span class="css">CSS |</span>
            <span class="js">JS</span>
        </div>
<br>
        <button>
            View Profile
        </button>

    </div>
<br>

</body>

</html>
