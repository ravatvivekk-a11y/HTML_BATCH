<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="todo-box">

            <div class="heading">
                <h3>Review Presentation</h3>
                <button class="add-btn">Add</button>
            </div>

            <div class="line"></div>

            <p class="count">
                You have <span>3</span> task(s) to complete
            </p>

            <div class="task">
                <input type="radio">
                <label>Edit Video</label>

                <button class="delete">icon</button>
                <button class="edit">icon</button>
            </div>

            <div class="task completed">
                <input type="radio" checked>
                <label>Buy Eggs & Milk</label>

                <button class="delete">icon</button>
                <button class="edit">icon</button>
            </div>

            <div class="task">
                <input type="radio">
                <label>Organize Files</label>

                <button class="delete">icon</button>
                <button class="edit">icon</button>
            </div>

            <div class="task">
                <input type="radio">
                <label>Write Blog Post</label>

                <button class="delete">icon</button>
                <button class="edit">icon</button>
            </div>

        </div>


        <div class="right-section">

            <p>With Free Source Code</p>

            <h1>TO DO LIST</h1>

            <h2>HTML, CSS, Javascript</h2>

        </div>

    </div>

</body>
</html>
