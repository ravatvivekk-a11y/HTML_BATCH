<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background-color:violet;
        }

        .Box{
            background-color: blueviolet;
            width: 200px;
            height: 200px;
             border-style:solid;
            border-color: tomato;
            border-width: 10px;

            border: 10px solid deeppink;
           

             margin-top: 200px;
            margin-left: 200px; 

            margin: auto;

            &:hover{
                border-radius: 50%;
                background-color: yellow;
                cursor:grab;
            }




        }

         .Box:hover{
            background-color: brown;
             height: 400px;
            width: 400px; 
        } 

        #Box1{
            background-color: red;
            width: 200px;
            height: 200px;
        }
        .Font{
            font-size: 50px;
            color: black;
            background-color: aliceblue;
            font-weight:900;
            font-style: italic;
            font-family: cursive;
            text-align: center;
            text-decoration: 10px overline red;
            text-transform: uppercase;
            letter-spacing: 15px;
            word-spacing: 10px;

             &:hover{
                color: yellow;
            } 
        }
         h1:hover{
            color: blue;
        } 
    </style>
</head>
